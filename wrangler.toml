#:schema node_modules/wrangler/config-schema.json
name = "cloudreve-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# 把 migrations/*.sql 当文本打进包里 —— 首次请求时 Worker 自动建表，
# 不需要本机跑任何迁移命令。见 src/db/provision.ts。
# ---------------------------------------------------------------------------
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# ---------------------------------------------------------------------------
# 这里**故意不写 [vars]**：「Deploy to Cloudflare」按钮会把 [vars] 里的每一项
# 都渲染成部署页的必填框，可选变量放进去会强迫所有用户填写。
# 需要时自己在面板（或 wrangler.toml）里加，代码对以下变量全部可缺省：
#   SITE_URL / FRONTEND_URL / LOG_LEVEL / CORS_ALLOW_ORIGINS / R2_PUBLIC_BASE
#   DB_PROVIDER（neon | postgres；留空按连接串域名自动判断）
# 机密（DATABASE_URL 等）声明在 .dev.vars.example，由部署页收集。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 数据库驱动（可选）
#
# 不配 DB_PROVIDER 时：DATABASE_URL 是 *.neon.tech → Neon HTTP 驱动；
# 其它一律走 postgres.js 的标准 PostgreSQL 协议。后者覆盖：
#   Supabase / CockroachDB / Xata（Postgres）/ Prisma Postgres /
#   Railway / Render / 自建 Postgres —— SQL 与迁移完全一致。
#
# 非 Neon 的 Postgres 建议再绑一个 Hyperdrive（边缘连接池），否则每个
# isolate 只有 1 条连接、新连接要重新付 TCP+TLS+认证：
#
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<Cloudflare 控制台创建的 Hyperdrive 配置 ID>"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# KV / R2：占位 ID **不用改**。
#   - 「Deploy to Cloudflare」按钮：部署时自动创建资源并回填。
#   - 面板手动接仓库（部署命令 `npm run deploy`）：scripts/deploy.mjs 会
#     自动创建 KV/R2 并把真实 ID 写进本文件。
#   - 本机手工 `npx wrangler deploy`：才需要先 `wrangler kv namespace create KV`
#     把返回的 id 换到这里。
# ---------------------------------------------------------------------------

[[r2_buckets]]
binding = "R2"
bucket_name = "cloudreve-worker"

# ---------------------------------------------------------------------------
# 可选的 R2 公共访问域名，用于生成不带签名的直链
# ---------------------------------------------------------------------------
# [vars]
# R2_PUBLIC_BASE = "https://files.example.com"

# ---------------------------------------------------------------------------
# 官方前端（cloudreve/frontend 的构建产物）
#
# frontend/ 目录**不入库**：`npm run build` / `npm run deploy` 会先跑
# scripts/fetch-frontend.mjs 自动获取（优先 Release 预构建包，否则拉上游
# 源码现构建，固定在上游 .gitmodules 指定的提交 19da0fe1）。
#
# run_worker_first 保证 API / 短链 / 直链 / WebDAV / PWA manifest 优先走 Worker，
# 其余交给静态资源与 SPA 回落（manifest.json 由 Worker 动态生成，静态产物
# 里没有这个文件，不进 Worker 就会被 SPA 回落成 index.html）。
# ⚠️ /dav/* 必须在名单里：静态资源层只支持 GET/HEAD，漏掉它的话
# PROPFIND / MKCOL / PUT 会被静态层直接回 405，WebDAV 挂载必然失败
# （现象：Windows 挂载网盘「位置不可用，无法访问」）。
# 想把前端单独部署到别处（Pages 等），不删 frontend/ 也行，
# 配 FRONTEND_URL 后反代优先于 [assets]。
# ---------------------------------------------------------------------------

# >>> multi-kv:begin
# 本区由 scripts/setup-kv.mjs 自动生成，请勿手改。
# KV_COUNT = 5（上限 5，超过则拒绝构建）
# 角色分工见 src/lib/kvRouter.ts：
#   KV_1=site(站点设置缓存) KV_2=session(会话/验证码/2FA)
#   KV_3=upload(上传/打包/WebDAV锁) KV_4=cred(外部凭据缓存)
#   KV_5=flag(自举标记)    KV=兜底（未配置 KV_n 时所有角色回落到它）

[[kv_namespaces]]
binding = "KV_1"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_1"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_PREVIEW_1"

[[kv_namespaces]]
binding = "KV_2"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_2"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_PREVIEW_2"

[[kv_namespaces]]
binding = "KV_3"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_3"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_PREVIEW_3"

[[kv_namespaces]]
binding = "KV_4"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_4"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_PREVIEW_4"

[[kv_namespaces]]
binding = "KV_5"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_5"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_PREVIEW_5"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_PREVIEW"
# <<< multi-kv:end

# ---------------------------------------------------------------------------
# 归档区 KV（可选，与上面的 KV_1..KV_5 相互独立）。
#
# 用途：留「被覆盖前的旧值」（归档）与「起了头但没走完的多步操作」（写前日志）。
# 之所以要独立一个 namespace：归档是**只增不减**的历史，而上面那些是
# 可被整体清理的缓存区 —— 放一起的话清一次缓存就把历史清了。
#
# 不想要这个能力可以不配：代码检测不到该绑定时会整体降级为 no-op，
# 站点所有功能照常（只是没有历史版本 / 未完成操作记录）。
# 想启用就删掉下面的注释，把 id 换成真实 namespace id（或让 deploy.mjs 自动创建）。
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "ARCHIVE_KV"
# id = "REPLACE_WITH_YOUR_ARCHIVE_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_YOUR_ARCHIVE_KV_NAMESPACE_ID_PREVIEW"

[assets]
directory = "./frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 关掉「自动去 .html 后缀」的重定向。
# 默认的 auto-trailing-slash 会把 /index.html 307 到 /、/pdfviewer.html 307 到
# /pdfviewer：前端 Service Worker 预缓存这两个文件时拿到的是 307，workbox 判为
# 坏响应，Chrome 直接 ERR_FAILED（Firefox 会回退网络所以看不出来）。
# 设 none 后 .html 原样 200，其余未知路径仍交给 not_found_handling 回退 index.html。
html_handling = "none"
# ⚠️ `/dav` 必须单独列一条**精确路径**：只写 `/dav/*` 的话裸 `/dav`（不带尾斜杠）
# 匹配不上，会落到静态资源处理器 —— 而它只支持 GET/HEAD，OPTIONS/PROPFIND 一律
# 405。MT管理器 / Alist / OpenList / 官方桌面端都会先探不带斜杠的地址，于是
# 「连接失败」。列了精确路径后由 Worker 自己处理（内部再 301 到 /dav/）。
run_worker_first = ["/api/*", "/s/*", "/f/*", "/dav", "/dav/*", "/manifest.json"]

# ---------------------------------------------------------------------------
# 定时任务（每小时整点）。需要同步在 src/index.ts 的 scheduled() 里处理，已实现。
# 目前做两件事：
#   1. **缓存刷新** —— 把站点设置这类缓存回源重写一遍，保证内容不会因为
#      「某条写路径漏了失效」而长期陈旧。只做覆盖写（零 list / 零 delete），
#      开销恒定，不随缓存键数增长。
#   2. 回收站到期清理（对应原版的 trash_collector 队列任务）。
#
# ⚠️ 这里**不做「清空 KV」**：KV 绑定没有批量删，逐键删会把免费档 50
#    subrequests 的预算烧光。「清空再重填」在构建期由
#    scripts/kv-purge-refill.mjs 完成（走 CLI 批量接口，无预算限制）。
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Smart Placement：把 Worker 放到离**数据库**更近的节点。
#
# 这个站点的每一次 API 请求都要打 3~7 次 Neon（打开 `/a/b` 这种路径：解析路径、
# 列目录、取元数据、算父路径…），而 Neon 只在亚太（新加坡）有，边缘节点在香港
# —— 每次往返 200~400ms，串起来就是「点一下目录要一秒多」。桌面端的 CFAPI
# 更是直接超时报「云操作未在超时时间结束之前完成」。
#
# mode = "smart" 让 CF 根据实际子请求延迟自动选执行位置（这里会落到新加坡），
# 每次往返降到个位数毫秒，代价是用户→Worker 多一跳（几十毫秒）。
# 静态资源不经 Worker，不受影响。
# ---------------------------------------------------------------------------
[placement]
mode = "smart"

[build]
command = ""
