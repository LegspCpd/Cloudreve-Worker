name: Build Frontend

# 前端构建全部在 Actions 里做，本机不跑 yarn/vite。
# 一次构建三个版本，打到同一个 Release（tag: frontend-assets）供各平台拉取：
#   cloudflare  全补丁 + _headers + 白屏自愈（CF Workers 默认）
#   universal   前端源码补丁，无 CF 专有的 _headers / 自愈（EdgeOne、ESA）
#   vanilla     纯上游 c7b6fa5，无补丁（对照/回滚）
#
# 本地 fetch-frontend.mjs 默认拉 cloudflare；EdgeOne/ESA 构建时传
# FRONTEND_VARIANT=universal，就能拿到自己的包。

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend-patches/**'
      - 'scripts/fetch-frontend.mjs'
      - '.github/workflows/build-frontend.yml'

permissions:
  contents: write # 上传 Release asset

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cloudflare, universal, vanilla]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 缓存 yarn 下载，三次构建共享
      - name: 缓存依赖下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-fe-${{ hashFiles('frontend-patches/dep-pins.json') }}

      - name: 构建前端（${{ matrix.variant }}）
        env:
          FRONTEND_VARIANT: ${{ matrix.variant }}
          # 强制走源码构建，不吃 Actions 缓存里可能存在的别版本 frontend/
          CLOUDREV_FE_RELEASE: '0'
        run: node scripts/fetch-frontend.mjs

      - name: 打包并上传 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          ASSET=$(node scripts/fetch-frontend.mjs --asset-name)
          echo "包名：$ASSET"
          rm -rf _pack && mkdir -p _pack/_frontend-src
          # 包内目录名必须和 fetch-frontend.mjs 的期待完全一致：
          #   _frontend-src/<ASSET 去掉 .tar.gz>/index.html
          # 早期这里多拼了一层 `frontend-`，下载后 lstat 失败，每次都退回
          # 源码构建；EdgeOne 的 /dev/shm 只有几十 MB，yarn 直接 ENOSPC。
          cp -r frontend "_pack/_frontend-src/${ASSET%.tar.gz}"
          tar -czf "$ASSET" -C _pack _frontend-src
          tar -tzf "$ASSET" | grep -q "^_frontend-src/${ASSET%.tar.gz}/index.html$" || {
            echo "包内结构不对：$ASSET"; exit 1;
          }
          # 只允许一个版本目录。之前包里被反复追加过 cloudflare/universal/
          # vanilla 多套目录，下载到的 universal 包实际装的是 cloudflare 内容。
          DIRS=$(tar -tzf "$ASSET" | awk -F/ 'NF>=2 && $2!="" {print $2}' | sort -u | wc -l)
          [ "$DIRS" -eq 1 ] || { echo "包内有 $DIRS 个版本目录：$ASSET"; exit 1; }
          gh release view frontend-assets >/dev/null 2>&1 || \
            gh release create frontend-assets --title "Frontend assets" \
              --notes "前端三版本预构建包：cloudflare / universal / vanilla，commit + 补丁哈希 + 版本各一包"
          gh release upload frontend-assets "$ASSET" --clobber
          echo "已发布 $ASSET"

