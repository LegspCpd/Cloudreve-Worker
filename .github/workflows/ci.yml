# ---------------------------------------------------------------------------
# 前端产物 + 构建检查 + 双平台部署
#
#   1. build-check：每次 push / PR 都跑 —— 类型检查 + 全部离线测试 + wrangler
#      dry-run 构建 + EdgeOne 云函数产物一致性门禁，另加一步「本仓库还没有
#      对应预构建包就发一个」（见下）。
#   2. deploy-check：只有配了 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#      两个 secrets 才真的部署 CF Worker（现在已配，每次 push 自动部署）。
#   3. edgeone-build：EdgeOne 完整构建 + 产物校验 + 上传 artifact，不要凭据。
#   4. edgeone-deploy：配了 EDGEONE_API_TOKEN / EDGEONE_CN_API_TOKEN 才部署
#      EdgeOne Makers（国际站 / 中国站），否则只打 notice 跳过。
#      ⚠️ 若 EdgeOne 项目仍绑着 Git 集成，push 会两套流程各部署一遍 ——
#      想以 Actions 为准就先关掉控制台的 Git 集成。
#   5. esa-build：阿里云 ESA 完整构建 + 4MB 代码包上限校验 + 产物 artifact，
#      不要凭据；部署走 ESA 控制台的 GitHub 集成（esa.jsonc）。
#
# 为什么要在 CI 里发前端包：CF 的构建机拿不到「另一条流水线的缓存」，
# 它只能按包名去 Release 下 —— 包名 = commit + 补丁内容哈希，而改过
# frontend-patches 的那次提交，这个包正是**本次构建**产出的。所以那条 CF
# 构建日志里出现「预构建包尚不存在 → 改从源码构建」是设计如此，不是故障；
# 这次发出来之后，同指纹的后续构建都能秒级命中。
#
# 可选 Secrets / Variables：
#   DATABASE_URL      主库连接串（deploy-check 用）
#   DATABASE_URL_2..5 备库连接串（可选；配了就会在部署前做一次全量同步）
#   KV_COUNT          要创建的 KV namespace 个数，1–5，默认 1
#   DB_FAILOVER       填 1 打开主库故障切换（慎用，见 README）
#
# 本地另有需要真实 PostgreSQL 的测试（不进 CI）：
#   npm run test:copy:setup && npm run test:copy    # COPY 全量同步真机往返
#   npm run test:multidb                            # 上面全部 + 路由测试
# ---------------------------------------------------------------------------
name: Cloudflare Workers Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 发布前端预构建包要往 Release 里写资产
permissions:
  contents: write

jobs:
  build-check:
    name: 构建 + dry-run 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 缓存官方前端产物：键里带上 fetch-frontend.mjs（内含固定的上游
      # COMMIT）与 frontend-patches/ 的内容哈希 —— 前端内容只因这两者变化，
      # 所以命中即可直接复用，省掉 Release 包下载或整段源码构建。
      # build 与 deploy 两个 job 共用同一键，后者复用前者刚存好的。
      - name: 缓存前端产物
        uses: actions/cache@v4
        with:
          path: frontend
          key: frontend-${{ hashFiles('scripts/fetch-frontend.mjs', 'frontend-patches/**') }}

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      # 数量来源优先级：仓库 Variables 的 KV_COUNT > 仓库里的 KV_COUNT 文件 > 默认 1。
      # 注意：这里**不能**写成 `vars.KV_COUNT || '1'` —— 那样在未配置 Variables 时
      # 会把 KV_COUNT 强制设成 '1'，反而覆盖掉仓库里已提交的 KV_COUNT 文件
      # （环境变量优先级高于文件）。留空即不设置，让脚本自己去读文件。
      - name: KV 绑定装配（校验 KV_COUNT 上限）
        run: npm run kv:setup
        env:
          KV_COUNT: ${{ vars.KV_COUNT }}

      # 这四个是纯离线测试（esbuild 打包后在内存里跑，不连任何外部服务），
      # 覆盖多 KV 角色路由、主备切换的路由决策、用户/用户组两级缓存
      # （含「8 个写方法是否都自动失效」——漏一个就是「改了不生效」甚至
      # 封禁不生效的安全问题）、以及缓存清空/刷新（含最关键的一条：
      # **清理绝不能碰自举标记**，否则每次冷启动都会重放自举把库打限流）。
      # COPY 真机往返需要本机 PostgreSQL，跑不了，因此不进 CI。
      - name: 多 KV / 主备路由 / 用户缓存 / 缓存清理回归测试
        run: |
          npm run test:kv-router
          npm run test:db-failover
          npm run test:user-cache
          npm run test:cache-purge

      # 干跑清理脚本：验证「缓存清单能被解析出来、角色映射没漂移」。
      # 不清任何东西（--dry），也不需要 Cloudflare 凭据 —— 未开通 KV 时
      # 它会因「toml 里没有真实 id」而跳过，同样是成功路径。
      - name: 校验 KV 清理脚本（干跑，不实际清理）
        run: npm run kv:purge:dry

      # 递归路径 SQL 的语义回归：跑在 PGlite（WASM 真 Postgres）上，不需要数据库
      # 服务。它守的是「路径不存在时不会返回父目录」这个安全性质 —— 2026-10-26
      # 就是靠本地跑真库才发现 SQL 返回的是「走到最深的那一级」，必须配深度校验。
      - name: 递归路径 SQL 回归
        run: npm run test:sql-recursive

      # 文件加密原语（AES-256-CTR）回归：守「前端块对齐分片加密 == 单流」与
      # 「后端任意块边界流式解密能还原」这两条 —— 它们是加密文件能否下载的底线。
      - name: 文件加密原语回归
        run: npm run test:enc

      # SQL 适配层（postgres.js）：占位符生成、惰性查询、事务顺序/回滚。
      # 它守住「换数据库驱动不改查询」这条 —— 所有 repo 都走同一个 Sql 接口。
      - name: SQL 驱动适配层回归
        run: npm run test:sql-adapter

      # 数据库语义回归：用 PGlite（编译成 WASM 的真 Postgres）跑一遍
      # migrations/*.sql 与那批 JSONB 单语句写路径（mergeSettings /
      # applyGroupPack / tryDeductCredit / createFoldersIfAbsent 等）。
      # 这同时验证「非 Neon 的 PostgreSQL 能整体建库」。
      - name: 数据库语义回归（PGlite）
        run: npm run test:sql-semantics

      # 纯函数回归：目前是 Content-Disposition 生成（文件名是用户可控字符串，
      # 直接拼进 HTTP 头，写错就是头注入或下载文件名乱码）。
      - name: 纯函数回归
        run: npm run test:lib

      - name: 构建 + dry-run 检查（含拉取官方前端）
        run: npm run build

      # EdgeOne 云函数产物必须与 api/ + src/ 同步：函数路由在构建前从仓库
      # 读取，产物没入库时 /api/* 会被 SPA fallback 回成 index.html，
      # 前端拿 HTML 当 JSON 解析 → themes undefined 白屏（生产踩过）。
      - name: EdgeOne 云函数产物一致性
        run: node scripts/build-edgeone.mjs --check

      # 前端 COMMIT 变了但还没有对应预构建包时，这一次是源码现构建。
      # 顺手把产物发到 Release（tag frontend-assets），下次 CI 与 Cloudflare
      # 的构建都能秒级命中；否则每 bump 一次前端都要再等一遍 yarn + vite。
      # 失败不影响构建结论（权限/网络问题只是让下次继续慢）。
      - name: 发布前端预构建包（缺失时）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 包名由脚本算（commit + 补丁哈希），CI 不再复刻命名规则
          ASSET=$(node scripts/fetch-frontend.mjs --asset-name)
          if gh release view frontend-assets --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "$ASSET 已存在，跳过"
            exit 0
          fi
          SHORT="${ASSET#frontend-}"
          SHORT="${SHORT%.tar.gz}"
          rm -rf _pack && mkdir -p _pack/_frontend-src
          cp -r frontend "_pack/_frontend-src/frontend-${SHORT}"
          tar -czf "$ASSET" -C _pack _frontend-src
          gh release view frontend-assets >/dev/null 2>&1 || \
            gh release create frontend-assets --title "Frontend assets" \
              --notes "fetch-frontend.mjs 快路径用的预构建前端产物，commit + 补丁哈希各一包"
          gh release upload frontend-assets "$ASSET" --clobber
          echo "已发布 $ASSET"

  # 仅当配了 CF 凭据时才有意义；当前没配（线上部署在 CF 面板的 Workers Builds）。
  # 保留它是因为「把部署收回 GitHub」只需要加两个 secret + 关掉 CF 的 Git 集成。
  deploy-check:
    name: 真实部署检查（未配凭据时跳过）
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name != 'pull_request'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 }}
      DATABASE_URL_3: ${{ secrets.DATABASE_URL_3 }}
      DATABASE_URL_4: ${{ secrets.DATABASE_URL_4 }}
      DATABASE_URL_5: ${{ secrets.DATABASE_URL_5 }}
      DB_FAILOVER: ${{ vars.DB_FAILOVER }}
      # 留空即不设置，让 setup-kv.mjs 去读仓库里的 KV_COUNT 文件。
      KV_COUNT: ${{ vars.KV_COUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 缓存官方前端产物：键里带上 fetch-frontend.mjs（内含固定的上游
      # COMMIT）与 frontend-patches/ 的内容哈希 —— 前端内容只因这两者变化，
      # 所以命中即可直接复用，省掉 Release 包下载或整段源码构建。
      # build 与 deploy 两个 job 共用同一键，后者复用前者刚存好的。
      - name: 缓存前端产物
        uses: actions/cache@v4
        with:
          path: frontend
          key: frontend-${{ hashFiles('scripts/fetch-frontend.mjs', 'frontend-patches/**') }}

      - name: 安装依赖
        run: npm install

      - name: 检查是否已配置部署凭据
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets，跳过真实部署检查"
          fi

      # 全量同步放在部署**之前**：备库先对齐到主库当前状态，
      # 再把新代码发布出去，避免出现「新代码 + 旧数据」的窗口。
      # 备库**结构性失败**（连不上 / 建不出表 / 缺表）会让这一步变红 ——
      # 那意味着这个备库根本没被用上，静默通过会让它永远是空库。
      # 只有数据搬运的偶发错误不阻断部署（备库是安全网）。
      - name: 检查是否配置了备库
        id: backups
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$DATABASE_URL_2" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置备库（DATABASE_URL_2..），跳过全量同步"
          fi

      - name: 主库 → 备库全量同步（自动为备库建表）
        if: steps.creds.outputs.ok == 'true' && steps.backups.outputs.ok == 'true'
        run: npm run db:sync

      - name: 真实部署（自动复用/创建 KV、R2）
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/deploy.mjs

  # -------------------------------------------------------------------------
  # EdgeOne Makers（Pages）：构建校验 + 实际部署
  #
  #   edgeone-build  不依赖任何凭据，push / PR 都跑：完整构建（前端 + Node
  #                  云函数）、组装自包含目录、校验平台配置、上传 artifact。
  #   edgeone-deploy 配了 EDGEONE_API_TOKEN（国际站）或 EDGEONE_CN_API_TOKEN
  #                  （中国站）才跑，用官方 CLI 部署上一步的产物。
  #                  两个 token 都配就依次部署两个站（--site global / china）。
  #
  # 可选 Secrets / Variables：
  #   EDGEONE_API_TOKEN       国际站 API Token
  #   EDGEONE_CN_API_TOKEN    中国站 API Token（可选）
  #   EDGEONE_PROJECT         国际站项目名，默认 cloudreve-worker-edgeone
  #   EDGEONE_CN_PROJECT      中国站项目名，默认 cloudreve-worker-edgeone-cn
  #   EDGEONE_ENV             部署环境 production / preview，默认 production
  #
  # ⚠️ 项目名必须填已存在的 Makers 项目；CLI 找不到同名项目会自动新建，
  #    那不会带自定义域名和环境变量。若现有项目是「Git 集成」类型，
  #    用 CLI 部署前需在控制台改成「直接上传」类型，或关掉 Git 集成，
  #    否则每次 push 会两套流程各部署一遍。
  # -------------------------------------------------------------------------
  edgeone-build:
    name: EdgeOne 构建 + 产物校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 缓存前端产物
        uses: actions/cache@v4
        with:
          path: frontend
          key: frontend-${{ hashFiles('scripts/fetch-frontend.mjs', 'frontend-patches/**') }}

      - name: 安装依赖
        run: npm install

      - name: 完整构建（前端 + Node 云函数）
        run: node scripts/build-edgeone.mjs

      - name: 组装自包含部署目录
        run: node scripts/assemble-edgeone.mjs

      - name: 校验产物与平台配置
        run: |
          test -s edgeone-publish/index.html
          test -s 'edgeone-publish/cloud-functions/[[default]].js'
          test -s edgeone-publish/edgeone.json
          node -e "const c=require('./edgeone-publish/edgeone.json'); if(!c.rewrites||!c.schedules||!c.cloudFunctions) throw new Error('edgeone.json 缺平台配置'); console.log('平台配置 OK:', Object.keys(c).join(','))"

      - name: 上传部署产物
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-publish
          path: edgeone-publish/
          retention-days: 7

  edgeone-deploy:
    name: EdgeOne 实际部署（未配 token 时跳过）
    runs-on: ubuntu-latest
    needs: [build-check, edgeone-build]
    if: github.event_name != 'pull_request'
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_CN_API_TOKEN: ${{ secrets.EDGEONE_CN_API_TOKEN }}
      EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
      EDGEONE_CN_PROJECT: ${{ vars.EDGEONE_CN_PROJECT }}
      EDGEONE_ENV: ${{ vars.EDGEONE_ENV }}
    steps:
      - name: 检查部署凭据
        id: creds
        run: |
          if [ -n "$EDGEONE_API_TOKEN" ]; then echo "global=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$EDGEONE_CN_API_TOKEN" ]; then echo "china=true" >> "$GITHUB_OUTPUT"; fi
          if [ -z "$EDGEONE_API_TOKEN" ] && [ -z "$EDGEONE_CN_API_TOKEN" ]; then
            echo "::notice::未配置 EDGEONE_API_TOKEN / EDGEONE_CN_API_TOKEN secrets，跳过 EdgeOne 部署"
          fi

      - name: 下载构建产物
        if: steps.creds.outputs.global == 'true' || steps.creds.outputs.china == 'true'
        uses: actions/download-artifact@v4
        with:
          name: edgeone-publish
          path: edgeone-publish

      - name: 部署国际站（global）
        if: steps.creds.outputs.global == 'true'
        run: |
          PROJECT="${EDGEONE_PROJECT:-cloudreve-worker-edgeone}"
          npx --yes edgeone makers deploy ./edgeone-publish \
            -n "$PROJECT" -t "$EDGEONE_API_TOKEN" \
            --site global -e "${EDGEONE_ENV:-production}"

      - name: 部署中国站（china）
        if: steps.creds.outputs.china == 'true'
        run: |
          PROJECT="${EDGEONE_CN_PROJECT:-cloudreve-worker-edgeone-cn}"
          npx --yes edgeone makers deploy ./edgeone-publish \
            -n "$PROJECT" -t "$EDGEONE_CN_API_TOKEN" \
            --site china -e "${EDGEONE_ENV:-production}"

  # -------------------------------------------------------------------------
  # 阿里云 ESA（函数和 Pages）：构建校验
  #
  #   ESA 是 V8 isolate + 部分 Node APIs，跟 EdgeOne 的 Node 云函数不是一回事：
  #   没有 net/tls（数据库只能 Neon HTTP、SMTP 直连不可用）、没有 KV 绑定
  #   （走 DB 兜底）、SPA 导航由 esa.jsonc 的 notFoundStrategy 处理。
  #   build-esa.mjs 用 platform=browser 打包并把 TCP 相关模块替换成 stub，
  #   产物 dist-server/esa.js 必须小于 ESA 的 4MB 代码包上限。
  #
  #   部署走 ESA 控制台的 GitHub 集成（esa.jsonc 自动生效），或本地
  #   esa-cli login/deploy。这里不塞没实测过的非交互部署命令。
  # -------------------------------------------------------------------------
  esa-build:
    name: ESA 构建 + 产物校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 缓存前端产物
        uses: actions/cache@v4
        with:
          path: frontend
          key: frontend-${{ hashFiles('scripts/fetch-frontend.mjs', 'frontend-patches/**') }}

      - name: 安装依赖
        run: npm install

      - name: 完整构建（前端 + ESA 函数入口）
        run: node scripts/build-esa.mjs

      - name: 校验产物与 4MB 代码包上限
        run: |
          test -s dist/index.html
          test -s dist-server/esa.js
          node -e "const b=require('fs').statSync('dist-server/esa.js').size; if(b>4*1024*1024) throw new Error('超过 ESA 4MB 代码包上限: '+b); console.log('esa.js', (b/1024).toFixed(0)+' KiB < 4MB')"
          grep -q 'singlePageApplication' esa.jsonc
          ! grep -q 'cloudflare:sockets' dist-server/esa.js
          ! grep -q 'node:net' dist-server/esa.js
          ! grep -q 'node:tls' dist-server/esa.js

      - name: 上传部署产物
        uses: actions/upload-artifact@v4
        with:
          name: esa-publish
          path: |
            dist/
            dist-server/
            esa.jsonc
          retention-days: 7
